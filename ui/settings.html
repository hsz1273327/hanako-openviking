<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenViking 设置</title>
  <link rel="stylesheet" href="./assets/panel.css">
  <style>
    .page { display: block; max-width: 560px; padding: 4px 2px 18px; }
    /* 字段本体交给 Vue + naive-ui；这里只补字号、间距与说明行，
       颜色走 ui-src/src/theme.js，与面板共用一份。 */
    .settings-form .n-form-item { margin-bottom: 14px; }
    .field-body { display: grid; gap: 5px; width: 100%; }
    .field-body .hint { font-size: 11px; opacity: 0.55; }
    .actions { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
    .status { font-size: 11.5px; opacity: 0.75; }
    .status.ok { color: #5d7d56; opacity: 1; }
    .status.bad { color: #b8564d; opacity: 1; }
    .status-alert { font-size: 11.5px; padding: 5px 10px; }
    .footnote {
      margin: 18px 0 0;
      padding-top: 12px;
      border-top: 1px solid rgba(128, 128, 128, 0.2);
      font-size: 11.5px;
      line-height: 1.55;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <!-- 设置页只做一件事：把这台机器接到中枢上去。
       运行时开关与召回策略都在「OpenViking」页面，那里改完即时生效。 -->
  <main class="page" data-hana-app-ui>
    <!-- 字段区整块交给 Vue（ui-src/src/SettingsApp.vue）。 -->
    <div id="settings-app"></div>

    <p class="footnote">
      总开关、自动召回、写回、只读、召回范围、技能路由、探针，以及召回判断与召回查询，
      都在「OpenViking」页面里改：跳过去改一下就生效，不用回这一页。
    </p>
  </main>
  <script type="module" src="./assets/settings.js"></script>
</body>
</html>
