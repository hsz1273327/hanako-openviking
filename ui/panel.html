<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenViking</title>
  <link rel="stylesheet" href="./assets/panel.css">
</head>
<body>
  <!-- 整页控制台：这台机器在一个共享中枢里是什么身份、通不通、在不在记，
       以及所有能当场改的开关。改了就生效，不用回设置页。 -->
  <main class="page" data-hana-app-ui>
    <header class="top">
      <div class="ident">
        <span id="dot" class="dot idle" aria-hidden="true"></span>
        <div class="ident-text">
          <div class="ident-line">
            <h1 class="title">OpenViking</h1>
            <span id="statePill" class="pill">未启用</span>
          </div>
          <p id="subLine" class="sub">—</p>
        </div>
      </div>
      <div class="top-actions">
        <button id="testBtn" class="btn" type="button">测试连接</button>
        <button id="refreshBtn" class="btn ghost" type="button">刷新</button>
      </div>
    </header>

    <section id="masterCard" class="master">
      <div class="master-copy">
        <h2 class="master-title">总闸</h2>
        <p id="masterHint" class="master-hint">关着等于没装。打开之后，下面这些开关才有意义。</p>
      </div>
      <button id="swEnabled" class="switch" type="button" role="switch" aria-checked="false" aria-label="总闸">
        <span class="knob"></span>
      </button>
    </section>

    <section id="toggleGrid" class="toggles">
      <div class="toggle" data-key="skillRouting">
        <div class="toggle-copy">
          <b>技能路由</b>
          <span>把共享技能交给助手按需调用</span>
        </div>
        <button class="switch sm" type="button" role="switch" data-key="skillRouting" aria-checked="false"><span class="knob"></span></button>
      </div>
      <div class="toggle" data-key="probe">
        <div class="toggle-copy">
          <b>探针</b>
          <span>把钩子事实记进日志</span>
        </div>
        <button class="switch sm" type="button" role="switch" data-key="probe" aria-checked="false"><span class="knob"></span></button>
      </div>
    </section>

    <p class="scoped-note">
      记忆召回、写回、只读、召回范围是<b>按会话</b>算的，在这段对话右侧的 OpenViking 卡片里改。
    </p>

    <section class="cols">
      <article class="card">
        <h2 class="card-title">中枢</h2>
        <div class="field">
          <label for="serverUrl">地址</label>
          <input id="serverUrl" type="url" spellcheck="false" placeholder="http://127.0.0.1:8000">
        </div>
        <div class="field">
          <label for="apiKey">API Key</label>
          <input id="apiKey" type="text" autocomplete="off" spellcheck="false" placeholder="未填写">
        </div>
        <div class="facts">
          <div class="fact"><span>往返</span><b id="latency">—</b></div>
          <div class="fact"><span>版本</span><b id="version">—</b></div>
          <div class="fact"><span>出口</span><b id="transport">—</b></div>
        </div>
        <ul id="checks" class="checks"></ul>
        <p id="reachError" class="err" hidden></p>
        <p id="saveHint" class="save-hint"></p>
      </article>

      <article class="card">
        <h2 class="card-title">身份</h2>
        <div class="field">
          <label for="peerPrefix">门牌前缀</label>
          <input id="peerPrefix" type="text" spellcheck="false" placeholder="可留空">
          <span class="field-hint">这一段对话算谁的，看右侧卡里的 peer。</span>
        </div>
        <div class="field pair">
          <label for="timeoutMs">超时（ms）</label>
          <label for="budgetTokens">注入预算（token）</label>
          <input id="timeoutMs" type="number" min="200" max="30000" step="100">
          <input id="budgetTokens" type="number" min="200" max="32000" step="100">
        </div>
      </article>
    </section>

    <section class="card logs">
      <header class="logs-head">
        <h2 class="card-title">日志</h2>
        <div id="logChips" class="chips"></div>
        <button id="logToggle" class="btn ghost sm" type="button">展开</button>
      </header>
      <pre id="logBody" class="log" hidden>（还没有记录）</pre>
    </section>

    <footer id="foot" class="foot"></footer>
  </main>
  <script type="module" src="./assets/panel.js"></script>
</body>
</html>
