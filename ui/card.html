<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenViking</title>
  <link rel="stylesheet" href="./assets/card.css">
</head>
<body>
  <!-- 会话卡：这段对话里的记忆行为，全部按会话算。
       记忆召回与只读两个开关改的是本会话覆盖值，点小字交回全局；
       召回范围也按会话走——这段对话查本机还是查跨门牌，不该由别的对话决定。
       写回是机器级的，在整页的「记忆共享」页里改。
       机器级的地址、key、总闸、技能路由、探针在整页。

       结构已经交给 Vue：源码 ui-src/src/CardApp.vue + components/CardRow.vue，
       构建产物 ui/assets/card.js。HTML 里只剩挂载点；
       data-hana-app-ui 必须留在 main 上，宿主靠它识别这张 App 卡。 -->
  <main class="ov" data-hana-app-ui><div id="card-app"></div></main>
  <script type="module" src="./assets/card.js"></script>
</body>
</html>
