<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenViking</title>
  <link rel="stylesheet" href="./assets/card.css">
</head>
<body>
  <!-- 会话卡：这一格只回答"当前这段对话里，记忆在不在动"。
       机器级的东西（总闸、地址、key）全在整页，这里不碰。 -->
  <main class="ov" data-hana-app-ui>
    <header class="row head">
      <span id="dot" class="dot idle" aria-hidden="true"></span>
      <span id="title" class="state">无活动会话</span>
      <span id="peer" class="peer"></span>
    </header>

    <div class="row meta">
      <span id="counter" class="meta-item">—</span>
      <span id="lastAt" class="meta-item"></span>
    </div>

    <div class="row chips">
      <button id="chipMemory" class="chip" type="button" data-key="autoRecall" title="点击：本会话开关，再点回到跟随全局">记忆</button>
      <button id="chipCapture" class="chip" type="button" data-key="autoCapture" title="点击：本会话开关，再点回到跟随全局">写回</button>
      <button id="chipReadOnly" class="chip" type="button" data-key="readOnly" title="点击：本会话开关，再点回到跟随全局">只读</button>
    </div>

    <p id="hint" class="hint"></p>
  </main>
  <script type="module" src="./assets/card.js"></script>
</body>
</html>
